name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        # Throwaway CI-only credentials for an ephemeral container (not a secret).
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: venture_lab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d venture_lab_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CI: 'true'
      TEST_DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/venture_lab_test
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/venture_lab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Unit + UI + PostgreSQL integration tests (integration suites fail, not skip, when CI=true).
      - run: npm test
      - run: npm run build
      - name: CLI smoke — migrate, dry-run, apply, idempotent re-import, isolated snapshots
        run: |
          npm run db:migrate
          npm run db:migrate
          npm run research:validate -- research/examples/synthetic-run-1.json
          npm run research:import -- research/examples/synthetic-run-1.json
          npm run research:import -- research/examples/synthetic-run-1.json --apply
          npm run research:import -- research/examples/synthetic-run-1.json --apply
          npm run research:snapshot -- --dataset test --as-of 2026-11-06 --apply
          npm run research:import -- research/examples/synthetic-run-2.json --apply
          npm run research:snapshot -- --dataset test --as-of 2026-11-06 --apply
          # REAL dataset must still be empty: synthetic imports never leak into it.
          npm run research:snapshot -- --as-of 2026-11-06 --apply | tee /tmp/real-snap.txt
          grep -q "нет оценённых идей" /tmp/real-snap.txt
      - name: CLI smoke — VL-003 draft gate, manual review, stored snapshot history
        run: |
          # The committed pilot draft is checked (structure only) and can NEVER be applied.
          npm run research:draft-check -- research/drafts/draft-2026-11-12-pilot-001.json
          if npm run research:import -- research/drafts/draft-2026-11-12-pilot-001.json --apply; then
            echo "ai-draft was applied — approval gate is broken"; exit 1
          fi
          npm run research:snapshot -- --dataset test --as-of 2026-11-11 --apply
          IDEA=$(node -e "console.log(require('./research/examples/synthetic-run-1.json').ideas[0].externalId)")
          SRC=$(node -e "console.log(require('./research/examples/synthetic-run-1.json').ideas[0].sources[0].id)")
          npm run research:review -- --dataset test --idea "$IDEA" --evidence "$SRC" --status rejected --reason "CI smoke: manual review event" --actor ci
          npm run research:review -- --dataset test --idea "$IDEA" --evidence "$SRC" --status rejected --reason "CI smoke: manual review event" --actor ci --apply
          # Cross-dataset review must be refused.
          if npm run research:review -- --dataset real --idea "$IDEA" --evidence "$SRC" --status rejected --reason "CI smoke: must be refused" --actor ci --apply; then
            echo "cross-dataset review was accepted"; exit 1
          fi
      - name: CLI smoke — VL-004A autonomous worker (fixture providers, no approval step)
        run: |
          npm run research:worker:run -- --fixture --as-of 2026-11-10
          npm run research:worker:run -- --fixture --as-of 2026-11-11
          npm run research:worker:run -- --fixture --as-of 2026-11-12 | tee /tmp/day3.txt
          grep -q "4/10" /tmp/day3.txt
          # idempotent: re-running a finished day changes nothing
          npm run research:worker:run -- --fixture --as-of 2026-11-12 | tee /tmp/again.txt
          grep -q "already-succeeded" /tmp/again.txt
          npm run research:worker:status -- --fixture
          # a run without an explicit feed is refused
          if npm run research:worker:run -- --as-of 2026-11-12; then echo "run without feed was not refused"; exit 1; fi
      - name: CLI smoke — VL-004B live adapters (no network, no paid calls)
        run: |
          # dry-run: config + worst-case plan, no request of any kind
          npm run research:worker:run -- --live --once --dry-run --as-of 2026-11-12 | tee /tmp/dry.txt
          grep -q "DRY-RUN" /tmp/dry.txt
          # paid execution is refused without Phase B configuration, and always refused in CI
          if npm run research:worker:run -- --live --once --execute --max-spend-rub 1; then echo "live execute was not refused"; exit 1; fi
          if VL_LIVE_PROVIDER=yandex YANDEX_FOLDER_ID=b1gcifolder0000000 YANDEX_API_KEY=ci-dummy-not-a-key npm run research:worker:run -- --live --once --execute --max-spend-rub 1; then echo "live execute ran in CI"; exit 1; fi
          # the probe is a paid execution too: refused without --execute, without the flag, and in CI
          if npm run research:worker:run -- --live --once --probe --max-spend-rub 5; then echo "probe without --execute was not refused"; exit 1; fi
          if VL_LIVE_PROVIDER=yandex YANDEX_FOLDER_ID=b1gcifolder0000000 YANDEX_API_KEY=ci-dummy-not-a-key VL_LIVE_EXECUTE=phase-b-authorized VL_TRIAL_ID=ci-trial npm run research:worker:run -- --live --once --execute --probe --max-spend-rub 5; then echo "probe ran in CI"; exit 1; fi
          # no schedule for live
          if npm run research:worker:tick -- --live; then echo "live tick was not refused"; exit 1; fi
          # recovery (succeeded → incomplete) is DB-only, audited, and refuses a stage that never ran
          if npm run research:worker:recover -- --live --trial ci-none --stage stage2 --mark-incomplete --apply; then echo "recover accepted a missing stage"; exit 1; fi
          # review export works offline (empty trial → header only)
          npm run research:worker:export -- --live --trial ci-none --out /tmp/review.csv
          head -1 /tmp/review.csv | grep -q "^kind,job_key,trial_stage" 
          # offline benchmark on recorded HTTP
          npm run research:benchmark | tee /tmp/bench.txt
          grep -q "offline benchmark" /tmp/bench.txt
